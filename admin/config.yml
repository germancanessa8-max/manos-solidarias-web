backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "/img"

collections:
  - name: "actividades"
    label: "Actividades y Brigadas"
    folder: "_actividades"
    create: true
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Descripción", name: "description", widget: "text"}
      - {label: "Fotografía", name: "image", widget: "image"}
